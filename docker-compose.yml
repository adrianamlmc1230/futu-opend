# =====================================================================
# 注意：
#   - network_mode: host 僅在 Linux 主機可用 (符合本專案部署環境)
#   - host 模式下，container 內可直接以 127.0.0.1:11111 連線到 OpenD
#   - restart: always 為唯一的「告警/重啟」機制
# =====================================================================
services:
  futu-collector:
    build: .
    container_name: futu-collector
    network_mode: host
    restart: always
    env_file:
      - .env
    environment:
      OPEND_HOST: 127.0.0.1
      OPEND_PORT: 11111
      FLUSH_INTERVAL: "2.0"
      MAX_QUEUE_SIZE: "50000"
      HEALTH_CHECK_INTERVAL: "30"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------
  # 冷熱分離排程器：每天 HKT 04:00 把昨天資料封存到 Cloudflare R2
  # 然後刪除 Supabase 上對應的 row。
  # ---------------------------------------------------------------
  data-archiver-cron:
    build:
      context: .
      dockerfile: Dockerfile.archiver
    container_name: data-archiver-cron
    restart: always
    env_file:
      - .env
    environment:
      TZ: Asia/Hong_Kong
      ARCHIVE_TIME: "04:30"           # HKT，夜期 03:00 收盤後留 30 分鐘 buffer
      ARCHIVER_RUN_AT_STARTUP: "0"    # 設 1 可在啟動時立刻跑一次（測試用）
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
